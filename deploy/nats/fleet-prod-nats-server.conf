# fleet-hub (fleet-hub) NATS server config — F2 server-half authorization
# (fleet-bus #104, posture: docs/f2-nats-auth-posture.md, ratified brief).
#
# This is the committed, deploy-reproducible form of the PROD hub config with
# the §4 per-agent deny-by-default subject allow-lists. It lands at
# /home/fleet/nats/nats-server.conf on fleet-hub; passwords are NEVER in this file —
# every credential is a ${FLEET_NATS_PW_*} env expansion resolved from the
# EnvironmentFile that deploy/nats/provision-fleet-auth.sh materializes from
# a password manager (item names are configurable in that script; values only
# ever land 0600 on the host).
#
# ROLLOUT STATE: FAIL-CLOSED (posture §6 as amended, PR #183 review gate).
# There is NO `no_auth_user` and NO default-permit anonymous seat: a connect
# without credentials is refused by the server. Mixed-fleet safety comes from
# ORDER, not permissiveness — §6 steps 2–3 (mint + distribute per-agent creds,
# add the $SYS context) complete BEFORE this config lands, so landing it IS the
# enforcement moment. Verification via /connz happens with credentialed agents.
#
# Keep this a TWIN of deploy/nats/fleet-staging-nats-server.conf except:
#   1. no jetstream {} block (JetStream is piloted on staging first, #124), and
#   2. this accounts/authorization model replaces staging's single shared user.
#      Prod and staging credentials stay DISTINCT identities (#105 HIGH-2).

listen: 0.0.0.0:4222
max_payload: 1048576

# Monitor on 8223 (fleet convention; 8222 is the websocket listener and answers
# HTTP with 400 — docs/runbook.md Troubleshooting).
http_port: 8223

server_name: fleet-hub

# --- Accounts ----------------------------------------------------------------
# Two accounts. Account boundaries are hard namespace isolation in NATS, so the
# SYS operator physically cannot touch the app plane and no app user can read
# $SYS (posture §4g DENY rows come free from this isolation).
#
# Inside FLEET, every user carries an explicit publish/subscribe allow-list.
# NATS default-denies anything not allowed once a direction has an allow list,
# which is what implements the §4 DENY rows: they are listed here as comments
# only where a reader might expect a grant, not as explicit deny entries.
#
# Subject patterns are exactly the fleet_nats.subjects builders' output for
# {env} in {dev, prod} — tests/test_authz_conf.py cross-checks this file
# against the builders so the matrix cannot drift from the code.

accounts {
    FLEET {
        users [
            # --- 4b. Manager / orchestrator (heron) --------------------------
            # allow_responses (not a subject grant) is the responder side of
            # request/reply: the server auto-grants a one-shot publish to the
            # reply subject of any request received (claim/arbitrate replies on
            # the worker's dynamic _INBOX). Preferred over a static _INBOX.>
            # publish grant (posture §4 note).
            # DENY (implicit): publishing {env}.agent.status.* — status is the
            # worker's voice; the manager reads it, never writes it.
            {
                user: "heron"
                password: $FLEET_NATS_PW_HERON
                permissions {
                    subscribe {
                        allow = [
                            "dev.agent.inbox.heron", "prod.agent.inbox.heron",
                            "dev.agent.status.>", "prod.agent.status.>",
                            "dev.agent.*.status.>", "prod.agent.*.status.>",
                            "dev.agent.claim.>", "prod.agent.claim.>",
                            "dev.agent.arbitrate.>", "prod.agent.arbitrate.>",
                            "dev.agent.heartbeat.*", "prod.agent.heartbeat.*",
                            "dev.agent.token_cost.*", "prod.agent.token_cost.*",
                            "dev.hub.control.*", "prod.hub.control.*",
                            "dev.hub.show-work", "prod.hub.show-work",
                            "dev.factory.runner.*", "prod.factory.runner.*",
                            "_INBOX.heron.>",
                        ]
                    }
                    publish {
                        allow = [
                            "dev.agent.*.dispatch.*", "prod.agent.*.dispatch.*",
                            "dev.agent.dispatch.*", "prod.agent.dispatch.*",
                            "dev.agent.relay.*", "prod.agent.relay.*",
                            "dev.agent.*.relay.*", "prod.agent.*.relay.*",
                            "dev.agent.wake.*", "prod.agent.wake.*",
                            "dev.agent.*.wake.*", "prod.agent.*.wake.*",
                            "dev.agent.dead-letter", "prod.agent.dead-letter",
                            "dev.kboard.task.*.*", "prod.kboard.task.*.*",
                            "dev.agent.heartbeat.heron", "prod.agent.heartbeat.heron",
                            "dev.agent.token_cost.heron", "prod.agent.token_cost.heron",
                            "dev.hub.show-work", "prod.hub.show-work",
                        ]
                    }
                    allow_responses: true
                }
            }

            # --- 4a. Worker agents (least-capable) ----------------------------
            # FleetBus derives a deterministic _INBOX.<principal>. prefix from
            # the authenticated config identity, so each worker can receive only
            # its own request/reply traffic.
            # DENY (implicit): dispatch/relay/wake publish (manager-only lanes),
            # peers' heartbeat/token_cost (no spoofing), hub.control (hub-only).
            #
            # BOTH subject forms per channel-scopable lane (fleet-bus #117). The
            # hub publishes the SCOPED form for a channelled session, so a
            # bare-only grant would make the server refuse every real
            # relay/wake/status — silent starvation, not a visible error.
            #
            # The ack/telemetry publish grants are the noise lanes (fleet-bus
            # #116). A worker PUBLISHES its acks and progress markers there and
            # subscribes to NEITHER: nothing in the fleet consumes them for
            # coordination, and the Discord bridge refuses them by subject.
            {
                user: "wren"
                password: $FLEET_NATS_PW_WREN
                permissions {
                    subscribe {
                        allow = [
                            "dev.agent.*.dispatch.wren", "prod.agent.*.dispatch.wren",
                            "dev.agent.dispatch.wren", "prod.agent.dispatch.wren",
                            "dev.agent.*.relay.wren", "prod.agent.*.relay.wren",
                            "dev.agent.relay.wren", "prod.agent.relay.wren",
                            "dev.agent.*.wake.wren", "prod.agent.*.wake.wren",
                            "dev.agent.wake.wren", "prod.agent.wake.wren",
                            "dev.agent.inbox.wren", "prod.agent.inbox.wren",
                            "dev.direct.wren", "prod.direct.wren",
                            "_INBOX.wren.>",
                        ]
                    }
                    publish {
                        allow = [
                            "dev.agent.status.*", "prod.agent.status.*",
                            "dev.agent.*.status.*", "prod.agent.*.status.*",
                            "dev.agent.ack.*", "prod.agent.ack.*",
                            "dev.agent.*.ack.*", "prod.agent.*.ack.*",
                            "dev.agent.telemetry.*", "prod.agent.telemetry.*",
                            "dev.agent.*.telemetry.*", "prod.agent.*.telemetry.*",
                            "dev.agent.claim.*", "prod.agent.claim.*",
                            "dev.agent.arbitrate.*", "prod.agent.arbitrate.*",
                            "dev.hub.show-work", "prod.hub.show-work",
                            "dev.agent.heartbeat.wren", "prod.agent.heartbeat.wren",
                            "dev.agent.token_cost.wren", "prod.agent.token_cost.wren",
                        ]
                    }
                }
            }
            {
                user: "finch"
                password: $FLEET_NATS_PW_FINCH
                permissions {
                    subscribe {
                        allow = [
                            "dev.agent.*.dispatch.finch", "prod.agent.*.dispatch.finch",
                            "dev.agent.dispatch.finch", "prod.agent.dispatch.finch",
                            "dev.agent.*.relay.finch", "prod.agent.*.relay.finch",
                            "dev.agent.relay.finch", "prod.agent.relay.finch",
                            "dev.agent.*.wake.finch", "prod.agent.*.wake.finch",
                            "dev.agent.wake.finch", "prod.agent.wake.finch",
                            "dev.agent.inbox.finch", "prod.agent.inbox.finch",
                            "dev.direct.finch", "prod.direct.finch",
                            "_INBOX.finch.>",
                        ]
                    }
                    publish {
                        allow = [
                            "dev.agent.status.*", "prod.agent.status.*",
                            "dev.agent.*.status.*", "prod.agent.*.status.*",
                            "dev.agent.ack.*", "prod.agent.ack.*",
                            "dev.agent.*.ack.*", "prod.agent.*.ack.*",
                            "dev.agent.telemetry.*", "prod.agent.telemetry.*",
                            "dev.agent.*.telemetry.*", "prod.agent.*.telemetry.*",
                            "dev.agent.claim.*", "prod.agent.claim.*",
                            "dev.agent.arbitrate.*", "prod.agent.arbitrate.*",
                            "dev.hub.show-work", "prod.hub.show-work",
                            "dev.agent.heartbeat.finch", "prod.agent.heartbeat.finch",
                            "dev.agent.token_cost.finch", "prod.agent.token_cost.finch",
                        ]
                    }
                }
            }

            # --- 4c. Hub / control-plane publisher (harness, steer — #59) -----
            # Publish-only, fire-and-forget frames (control.py); the explicit
            # subscribe deny closes the NATS gotcha that an omitted direction
            # defaults to ALLOW-ALL, not deny.
            {
                user: "fleet-hub-control"
                password: $FLEET_NATS_PW_HUB_CONTROL
                permissions {
                    subscribe { deny = [">"] }
                    publish {
                        allow = [
                            "dev.hub.control.*", "prod.hub.control.*",
                        ]
                    }
                }
            }

            # --- 4d. Open Brain (memory transport — open-brain #223) ----------
            # PROVISIONED, not yet live: OB's context-pack request/reply worker
            # on {env}.ob.memory.context_pack exists in code (fleet-bus #221,
            # builder subjects.ob_context_pack), but every deployed OB worker
            # pins OPENBRAIN_TRANSPORT=http / OPENBRAIN_NATS_ENABLE_BRIDGE=false
            # (open-brain/scripts/worker-env.ts), so nothing uses this grant yet.
            # The grant lands now so the lane is ready; see docs/consumers.md.
            # Granted its own ob.* memory lanes only.
            # DENY (implicit): all {env}.agent.* coordination lanes — OB is not
            # a coordination participant.
            {
                user: "open-brain"
                password: $FLEET_NATS_PW_OPEN_BRAIN
                permissions {
                    subscribe { allow = ["dev.ob.>", "prod.ob.>"] }
                    publish { allow = ["dev.ob.>", "prod.ob.>"] }
                }
            }

            # --- 4e. k-board publisher (server-side) ---------------------------
            # Delivers task lifecycle events; not a coordinator. Publish-only,
            # same explicit subscribe deny as the control publisher.
            {
                user: "fleet-kboard"
                password: $FLEET_NATS_PW_KBOARD
                permissions {
                    subscribe { deny = [">"] }
                    publish {
                        allow = [
                            "dev.kboard.task.*.*", "prod.kboard.task.*.*",
                        ]
                    }
                }
            }

            # --- 4h. Software-factory runner boxes (fleet-bus #222) ------------
            # THE load-bearing grant in this file. A runner box is a disposable
            # privileged LXC clone running a coding agent with
            # bypassPermissions / sandbox_mode=danger-full-access over untrusted
            # repository content. It must be able to report progress and must
            # NEVER be able to receive an instruction from the bus, so the
            # subscribe deny is the security boundary — not the client-side
            # CODE_PUBLISH_ONLY_ROLES set, which a compromised runner could
            # simply ignore by calling nc.subscribe() itself.
            #
            # One shared principal, not one per job: runner boxes are created
            # and destroyed per job, so a per-job credential would mean minting
            # on the hot path. Confinement does not depend on job identity —
            # every runner is equally untrusted and equally publish-only.
            #
            # DENY (explicit, ">"): dispatch, relay, wake, inbox, token_cost,
            # and every other subject in both accounts. Dispatch reaches a
            # runner over the durable Postgres path (job row + atomic claim),
            # never over NATS — per C3 the core bus is at-most-once with no
            # retention, so it is the wrong transport for handing out work.
            {
                user: "fleet-runner"
                password: $FLEET_NATS_PW_RUNNER
                permissions {
                    subscribe { deny = [">"] }
                    publish {
                        allow = [
                            "dev.factory.runner.*", "prod.factory.runner.*",
                        ]
                    }
                }
            }

            # --- 4f. Local-dev (Mac / human on the direct.* lane) --------------
            # DENY (implicit): dispatch/relay/wake/status — local-dev is not the
            # manager and not a worker.
            {
                user: "local-dev"
                password: $FLEET_NATS_PW_LOCAL_DEV
                permissions {
                    subscribe { allow = ["dev.direct.local-dev", "prod.direct.local-dev"] }
                    publish { allow = ["dev.direct.*", "prod.direct.*"] }
                }
            }
        ]
    }

    # --- 4g. $SYS operator context ----------------------------------------
    # Closes THE observability gap (connz/subsz during floods, posture §3).
    # Used by the operator + fleet dashboard, never by an agent. Account
    # isolation already walls it off from the FLEET app plane; the explicit
    # allow-list below additionally scopes it to least-privilege monitoring
    # INSIDE the SYS account (posture §4g): read $SYS events, drive the
    # $SYS.REQ.> monitoring request/reply lane, receive replies on its own
    # _INBOX — no arbitrary publish within SYS.
    SYS {
        users [
            {
                user: "fleet-sys-operator"
                password: $FLEET_NATS_PW_SYS_OPERATOR
                permissions {
                    subscribe { allow = ["$SYS.>", "_INBOX.fleet-sys-operator.>"] }
                    publish { allow = ["$SYS.REQ.>"] }
                }
            }
        ]
    }
}

system_account: SYS

# FAIL-CLOSED: no `no_auth_user` mapping exists in this config. A client that
# presents no credentials is refused at connect (posture §6 as amended — the
# default-permit anonymous seat was removed at the PR #183 review gate).
