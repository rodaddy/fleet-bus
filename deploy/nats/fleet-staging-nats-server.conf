# fleet-staging NATS server config — JetStream PILOT (fleet-bus #124 / J3, #123).
#
# This is the committed, deploy-reproducible form of the config sketched in
# docs/f3-staging-shadow-hub.md §2. JetStream is NOT enabled on prod (fleet-hub);
# the whole point of the F3 staging/shadow hub is a SEPARATE box where JetStream
# can be proven before it graduates to prod. This file lands at
# /home/fleet/nats/nats-server.conf on the STAGING host and is what the systemd
# unit runs (see the prod override.conf model on fleet-hub).
#
# Deltas from the prod config (listen + max_payload only) are exactly two:
#   1. the jetstream {} block below (why staging must be a separate server —
#      you cannot enable it on prod to test it), and
#   2. a DISTINCT staging credential/identity (the real isolation boundary,
#      fleet-bus #105 HIGH-2) whose VALUE is minted at GO time via Vaultwarden
#      and injected as $STAGING_NATS_PASSWORD — never committed here.
#
# Keep this a TWIN of prod except those two deltas, so a topology change proven
# on staging transfers to prod without config surprises. When the JetStream
# pilot graduates, this jetstream {} block is what lands on prod; the
# credentials stay separate.

listen: 0.0.0.0:4222
max_payload: 1048576

# Monitor on 8223 to match the prod convention + the repo probes
# (docs/runbook.md, specs/probe-trio-subscribers.sh). NOT 8222 — on the fleet
# servers 8222 is the websocket listener and answers HTTP with 400.
http_port: 8223

server_name: fleet-staging

# --- AUTH: the isolation boundary (fleet-bus #105 HIGH-2) --------------------
# A staging server MUST require auth, or a prod-labeled client that resolves to
# the staging IP connects freely (and the reverse). The staging credential is a
# DISTINCT identity from prod: prod creds are INVALID here, staging creds
# INVALID on prod. Mint the VALUE at GO time via the approved secret path
# (Vaultwarden) and inject it as the env var below; never commit a real secret.
authorization {
    user: "fleet-staging"
    # Injected at provision from the secret store, NOT committed. nats-server
    # expands ${STAGING_NATS_PASSWORD} from its environment (EnvironmentFile on
    # the staging systemd unit).
    password: $STAGING_NATS_PASSWORD
}

# JetStream PILOT — the whole reason staging is a separate server. Never enabled
# on prod until proven here. store_dir MUST be writable by the nats-server run
# user (the `fleet` user on the fleet hosts); JetStream silently fails to enable
# if it cannot write its store. Create it before first start:
#   install -d -o fleet -g fleet -m 0750 /home/fleet/nats/jetstream
# (deploy/nats/provision-jetstream.sh does this + verifies /jsz reports enabled).
jetstream {
    store_dir: /home/fleet/nats/jetstream
    max_memory_store: 256MB
    max_file_store: 2GB
}
