name: Deploy fleet hub

on:
  workflow_run:
    workflows: [Request fleet hub deploy]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fleet-hub-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy requested main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, fleet-bus]
    timeout-minutes: 20
    environment:
      name: fleet-bus-production
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify immutable main selection
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Transfer and deploy immutable release on fleet-hub
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/deploy-hub-remote.sh
